version: "3"

services:

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: payment_system
    ports:
      - "3306:3306"

  api:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      - mysql

  gateway:
    build: .
    command: node docker/mock-gateway.js
    ports:
      - "4000:4000"